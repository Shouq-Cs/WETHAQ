<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WETHAQ Beta - Create Account</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <main class="page-wrapper">

    <section class="login-card register-card">

      <div class="top-badge">Create Your WETHAQ Account</div>

      <div class="brand-section">
        <div class="logo-box">
          <img src="logo.png" alt="WETHAQ Logo" />
        </div>

        <h1>Create Account</h1>
        <p class="subtitle">
          Select your role to access the correct WETHAQ interface.
        </p>
      </div>

      <form class="login-form" onsubmit="createAccount(event)">
        <div class="input-group">
          <label for="fullName">Full Name</label>
          <input 
            type="text" 
            id="fullName" 
            placeholder="Enter your full name" 
          />
          <small id="nameError" class="error-message"></small>
        </div>

        <div class="input-group">
          <label for="registerEmail">University Email</label>
          <input 
            type="email" 
            id="registerEmail" 
            placeholder="example@student.ksu.edu.sa" 
          />
          <small id="registerEmailError" class="error-message"></small>
        </div>

        <div class="input-group">
          <label for="registerRole">Role</label>
          <select id="registerRole">
            <option value="">Select your role</option>
            <option value="student">Student / Faculty Member</option>
            <option value="staff">Department Staff</option>
            <option value="admin">University Administrator</option>
          </select>
          <small id="roleError" class="error-message"></small>
        </div>

        <div class="input-group">
          <label for="registerPassword">Password</label>
          <input 
            type="password" 
            id="registerPassword" 
            placeholder="Create a password" 
          />
          <small id="registerPasswordError" class="error-message"></small>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            placeholder="Confirm your password" 
          />
          <small id="confirmPasswordError" class="error-message"></small>
        </div>

        <button type="submit" class="login-btn">Create Account</button>

        <p class="create-account">
          Already have an account?
          <a href="index.html">Log In</a>
        </p>
      </form>

    </section>

  </main>

  <div id="accountModal" class="modal-overlay hidden">
    <div class="success-modal">
      <div class="modal-icon">✓</div>

      <h2>Account Created Successfully</h2>

      <p>
        Your WETHAQ Beta account has been created. You can now log in using your university email and password.
      </p>

      <div class="modal-actions">
        <button onclick="goToLogin()" class="primary-btn">
          Go to Log In
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
