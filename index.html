<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WETHAQ - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <main class="page-wrapper">

    <section class="login-card">

      <div class="top-badge">Secure University Access</div>

      <div class="brand-section">
        <div class="logo-box">
          <img src="logo.png" alt="WETHAQ Logo" />
        </div>

        <h1>WETHAQ </h1>
        <p class="subtitle">
          AI-Powered University Complaint Management System
        </p>
      </div>

      <form class="login-form" onsubmit="login(event)">
        <div class="input-group">
          <label for="email">University Email</label>
          <input 
            type="email" 
            id="email" 
            placeholder="example@student.ksu.edu.sa" 
          />
          <small id="emailError" class="error-message"></small>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-box">
            <input 
              type="password" 
              id="password" 
              placeholder="Enter your password" 
            />
            <button type="button" class="show-btn" onclick="togglePassword()">Show</button>
          </div>
          <small id="passwordError" class="error-message"></small>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" />
            Remember me
          </label>

          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn">Log In</button>

        <p class="create-account">
          Don’t have an account?
          <a href="#">Create Account</a>
        </p>
      </form>

      <div class="mini-features">
        <div class="mini-feature">✓ AI Classification</div>
        <div class="mini-feature">✓ Status Tracking</div>
        <div class="mini-feature">✓ Smart Routing</div>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
